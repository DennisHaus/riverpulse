name: Daten aufbereiten

on:
  workflow_dispatch:
    inputs:
      skip_pointcloud:
        description: 'Punktwolke nicht neu rechnen (schneller, die bisherige bleibt erhalten)'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: build-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Speicherplatz freigeben
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h .

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      # Höhenmodell-Kacheln zwischenspeichern, damit ein zweiter Lauf schneller ist
      - uses: actions/cache@v4
        with:
          path: |
            .cache/dtm
            .cache/dsm
          key: rasters-${{ hashFiles('config/**') }}
          restore-keys: rasters-

      - name: Aufbereitung
        env:
          SKIP_PC: ${{ inputs.skip_pointcloud }}
          GH_TOKEN: ${{ github.token }}
        run: |
          SKIP=""
          if [ "$SKIP_PC" = "true" ]; then
            SKIP="--skip pointcloud"
            # bisherige Punktwolke übernehmen
            if gh release download data-latest --pattern data.tar.gz --repo "$GITHUB_REPOSITORY" --dir prev; then
              mkdir -p build
              tar -xzf prev/data.tar.gz -C build data/pc || true
            fi
          fi
          python pipeline/build_all.py --config config/linthebene.json --out build/data $SKIP
          du -sh build/data

      - name: Als Release-Datei ablegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -czf data.tar.gz -C build data
          ls -lh data.tar.gz
          gh release view data-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create data-latest --repo "$GITHUB_REPOSITORY" \
              --title "Aufbereitete Daten" \
              --notes "Wird vom Workflow 'Daten aufbereiten' automatisch überschrieben."
          gh release upload data-latest data.tar.gz --clobber --repo "$GITHUB_REPOSITORY"

      - name: Seite neu veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref "${{ github.ref_name }}" --repo "$GITHUB_REPOSITORY"
