name: Seite veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Aufbereitete Daten aus dem Release holen
        id: data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download data-latest --pattern data.tar.gz --repo "$GITHUB_REPOSITORY"; then
            tar -xzf data.tar.gz -C site
            echo "found=true" >> "$GITHUB_OUTPUT"
            du -sh site/data
          else
            echo "Noch keine aufbereiteten Daten – es werden Demodaten erzeugt."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.data.outputs.found == 'false'
        with:
          python-version: '3.12'

      - name: Demodaten erzeugen
        if: steps.data.outputs.found == 'false'
        run: |
          pip install -r pipeline/requirements.txt
          python pipeline/make_demo_data.py --out site/data

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
