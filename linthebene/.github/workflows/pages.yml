name: Seite veröffentlichen

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Die Web-App liegt normalerweise in site/. Liegen index.html, app.js usw.
      # direkt im Hauptordner des Repositorys, wird dieser verwendet.
      - name: Ordner der Web-App bestimmen
        id: dir
        run: |
          if [ -f site/index.html ]; then SRC=site; elif [ -f index.html ]; then SRC=.; else
            echo "::error::Keine index.html gefunden (weder in site/ noch im Hauptordner)."; exit 1; fi
          mkdir -p _site
          for f in index.html app.js style.css config.js; do
            if [ -f "$SRC/$f" ]; then cp "$SRC/$f" _site/; else echo "::error::$f fehlt in $SRC/"; exit 1; fi
          done
          [ -d "$SRC/data" ] && cp -r "$SRC/data" _site/ || true
          touch _site/.nojekyll
          echo "Web-App aus: $SRC"

      - name: Aufbereitete Daten aus dem Release holen
        id: data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download data-latest --pattern data.tar.gz --repo "$GITHUB_REPOSITORY"; then
            tar -xzf data.tar.gz -C _site
            echo "found=true" >> "$GITHUB_OUTPUT"
            du -sh _site/data
          else
            echo "Noch keine aufbereiteten Daten vorhanden."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.data.outputs.found == 'false' && hashFiles('pipeline/make_demo_data.py') != ''
        with:
          python-version: '3.12'

      - name: Demodaten erzeugen
        if: steps.data.outputs.found == 'false' && hashFiles('pipeline/make_demo_data.py') != ''
        run: |
          pip install -r pipeline/requirements.txt
          python pipeline/make_demo_data.py --out _site/data

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
